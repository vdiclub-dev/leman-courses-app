<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Commande transport</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#082A44,#0F3D66);
  color:#fff;
  padding:20px;
}
.card{
  max-width:520px;
  margin:auto;
  background:#fff;
  color:#000;
  border-radius:16px;
  padding:20px;
}
h1{text-align:center;color:#082A44;}
label{font-size:13px;margin-top:10px;display:block;}
input,select,button{
  width:100%;
  padding:12px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  background:#082A44;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5;}
.price{
  margin:20px 0;
  font-size:26px;
  text-align:center;
  font-weight:bold;
  color:#082A44;
}
.info{
  font-size:12px;
  margin-top:10px;
  color:#333;
}
</style>
</head>

<body>

<div class="card">
<h1>LÉMAN COURSES</h1>

<!-- CLIENT -->
<label>Nom / Prénom</label>
<input id="clientNom">

<label>Téléphone</label>
<input id="clientTel">

<!-- TRAJET -->
<label>Kilomètres (distance estimée)</label>
<input id="km" type="number" min="1">

<label>Service</label>
<select id="service">
  <option value="normal">Normal</option>
  <option value="urgent">Urgent</option>
  <option value="express">Express</option>
</select>

<label>Période</label>
<select id="horaire">
  <option value="jour">Jour</option>
  <option value="nuit">Nuit / Dimanche</option>
</select>

<label>Poids du colis (kg)</label>
<input id="poids" type="number" min="1">

<div class="price" id="resultat">CHF –</div>

<button id="sendBtn" onclick="envoyerCommande()" disabled>
Envoyer la commande
</button>

<div class="info">
Prix indicatif – confirmation avant prise en charge<br>
> 30 kg : devis spécial obligatoire
</div>
</div>

<script>
/* =========================
   GRILLE TARIFAIRE KM
========================= */
const grille = [
  {max:10,  normal:6.5, urgent:43, express:30},
  {max:30,  normal:10, urgent:73, express:48},
  {max:80,  normal:13.5, urgent:103, express:66},
  {max:150, normal:17, urgent:133, express:84},
  {max:300, normal:24, urgent:193, express:120},
  {max:500, normal:38, urgent:313, express:192},
  {max:1000,normal:73, urgent:613, express:372},
  {max:1500,normal:108,urgent:913, express:552}
];

/* =========================
   COEF POIDS
========================= */
function coefPoids(p){
  if(p<=5) return 1;
  if(p<=10) return 1.1;
  if(p<=20) return 1.25;
  if(p<=30) return 1.4;
  return null;
}

/* =========================
   CALCUL PRIX
========================= */
function calculer(){
  const km = Number(kmInput.value);
  const poids = Number(poidsInput.value);
  const service = serviceSelect.value;
  const horaire = horaireSelect.value;

  if(!km || !poids) return;

  if(poids>30){
    resultat.textContent = "Devis spécial requis";
    sendBtn.disabled = true;
    return;
  }

  const ligne = grille.find(g => km <= g.max);
  if(!ligne){
    resultat.textContent = "Distance hors grille";
    sendBtn.disabled = true;
    return;
  }

  let prix = ligne[service];

  if(horaire==="nuit") prix *= 1.25;
  prix *= coefPoids(poids);

  prix = Math.round(prix/5)*5;

  resultat.textContent = "CHF " + prix + ".–";
  sendBtn.disabled = false;
}

/* =========================
   ENVOI EMAIL
========================= */
function envoyerCommande(){
  const sujet = "Commande Léman Courses";
  const corps =
`Client : ${clientNom.value}
Téléphone : ${clientTel.value}

Distance : ${kmInput.value} km
Poids : ${poidsInput.value} kg
Service : ${serviceSelect.value}
Période : ${horaireSelect.value}

${resultat.textContent}`;

  window.location.href =
   "mailto:info@leman-courses.ch"+
   "?subject="+encodeURIComponent(sujet)+
   "&body="+encodeURIComponent(corps);
}

/* =========================
   EVENTS
========================= */
const kmInput = document.getElementById("km");
const poidsInput = document.getElementById("poids");
const serviceSelect = document.getElementById("service");
const horaireSelect = document.getElementById("horaire");
const resultat = document.getElementById("resultat");
const sendBtn = document.getElementById("sendBtn");

[kmInput,poidsInput,serviceSelect,horaireSelect]
.forEach(el => el.addEventListener("input", calculer));
</script>

</body>
</html>
